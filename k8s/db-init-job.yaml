# One-time job to load app/schema.sql into RDS. RDS is deliberately
# unreachable from your laptop (publicly_accessible = false, security
# group only allows EKS nodes) - so this has to run as a pod inside the
# cluster instead of a local `mysql` command.
#
# Usage (from the project root, after k8s/service.yaml's Secret is applied):
#   kubectl -n automobile create configmap db-schema --from-file=schema.sql=app/schema.sql
#   kubectl apply -f k8s/db-init-job.yaml
#   kubectl -n automobile logs job/db-init            # confirm it succeeded
#   kubectl -n automobile delete job db-init           # clean up when done
#   kubectl -n automobile delete configmap db-schema
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: automobile
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-client
          image: mysql:8.0
          command:
            - sh
            - -c
            - "mysql -h \"$DB_HOST\" -u \"$DB_USER\" -p\"$DB_PASSWORD\" \"$DB_NAME\" < /schema/schema.sql && echo 'Schema loaded successfully'"
          envFrom:
            - secretRef:
                name: automobile-db-secret
          volumeMounts:
            - name: schema
              mountPath: /schema
      volumes:
        - name: schema
          configMap:
            name: db-schema
